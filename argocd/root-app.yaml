apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-sandbox-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yousef-usama/tenant-sandbox-manifests.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
