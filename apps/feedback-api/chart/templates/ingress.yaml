{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-api
  namespace: {{ .Values.tenantName }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    external-dns.alpha.kubernetes.io/hostname: {{ printf "%s.%s" .Values.tenantName .Values.domainName | quote }}
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - {{ .Values.tenantName }}.{{ .Values.domainName }}
      secretName: feedback-api-tls
  rules:
    - host: {{ .Values.tenantName }}.{{ .Values.domainName }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: feedback-api
                port:
                  name: http
{{- end }}
