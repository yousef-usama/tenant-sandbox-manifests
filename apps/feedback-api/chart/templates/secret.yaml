apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: feedback-postgres
  namespace: {{ .Values.tenantName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: feedback-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_DB: {{ .Values.postgres.database | quote }}
        POSTGRES_USER: {{ .Values.postgres.username | quote }}
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        DATABASE_URL: {{ printf "postgres://%s:{{ .password }}@feedback-postgres.%s.svc.cluster.local:5432/%s?sslmode=disable" .Values.postgres.username .Values.tenantName .Values.postgres.database | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgres.secretKey | quote }}
        property: password
