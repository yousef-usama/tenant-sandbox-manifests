apiVersion: v1
kind: Secret
metadata:
  name: feedback-postgres
  namespace: {{ .Values.tenantName }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@feedback-postgres.%s.svc.cluster.local:5432/%s?sslmode=disable" .Values.postgres.username .Values.postgres.password .Values.tenantName .Values.postgres.database | quote }}

