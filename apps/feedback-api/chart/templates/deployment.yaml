apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-api
  namespace: {{ .Values.tenantName }}
  labels:
    {{- include "feedback-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: feedback-api
      tenant: {{ .Values.tenantName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feedback-api
        tenant: {{ .Values.tenantName }}
    spec:
      serviceAccountName: feedback-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feedback-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: TENANT_NAME
              value: {{ .Values.tenantName | quote }}
            - name: EXPORT_BUCKET
              value: {{ .Values.exportBucket | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: feedback-postgres
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
