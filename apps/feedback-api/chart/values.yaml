tenantName: tenant-a
domainName: yousef-usama-cloud.click

image:
  repository: 339712755065.dkr.ecr.eu-central-1.amazonaws.com/tenant-sandbox/feedback-api
  tag: local
  pullPolicy: IfNotPresent

serviceAccount:
  annotations: {}

api:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: gp3
  database: feedback
  username: feedback
  secretKey: tenant-sandbox/tenant-a/postgres
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

exportBucket: tenant-sandbox-tenant-a-exports

ingress:
  enabled: true
  groupName: tenant-sandbox
  allowedCidrs:
    # Public VPC subnets only. Do not use the VPC CIDR: it contains tenant Pod IPs.
    - 10.40.0.0/24
    - 10.40.1.0/24
    - 10.40.2.0/24

egress:
  endpointCidrs:
    # Private VPC subnets containing interface VPC endpoints (STS, ECR, CloudWatch Logs).
    - 10.40.10.0/24
    - 10.40.11.0/24
    - 10.40.12.0/24

monitoring:
  serviceMonitor:
    enabled: true
