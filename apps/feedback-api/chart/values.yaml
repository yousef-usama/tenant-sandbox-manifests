tenantName: tenant-a
domainName: your-domain.click

image:
  repository: ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/tenant-sandbox/feedback-api
  tag: local
  pullPolicy: IfNotPresent

serviceAccount:
  annotations: {}

api:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image: postgres:16-alpine
  storage: 1Gi
  database: feedback
  username: feedback
  password: change-me-demo-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  certificateIssuer: letsencrypt-staging

monitoring:
  serviceMonitor:
    enabled: true

